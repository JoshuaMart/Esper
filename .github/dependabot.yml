# Everything is pinned (actions by commit, images by digest, packages by lockfile), so nothing moves
# unless this proposes it. Updates come once a month, one pull request per ecosystem, and wait a day
# after a release, as pnpm's minimumReleaseAge does. The scip-go binary, installed by version in its
# Dockerfile, is not covered and is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ["*"]

  # The workspace's one lockfile, docs included.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      workspace:
        patterns: ["*"]
    # The types follow the oldest Node the engines allow, so that no newer API is used unseen.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The analyzers' own programs: an update may move the call edges the hand counts check (D16).
  - package-ecosystem: npm
    directories:
      - /analyzers/scip-typescript/esper
      - /analyzers/scip-python/esper
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      analyzers-npm:
        patterns: ["*"]
    # pnpm installs every target, and pnpm 12 refuses those of pnpm 10 that keep their settings
    # (`overrides`) in package.json, while pnpm 10 reads the lockfiles of pnpm 12: a major version
    # is moved by hand, once the targets it would break are rare.
    ignore:
      - dependency-name: pnpm
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /analyzers/scip-go/esper
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      analyzers-go:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /analyzers/scip-go
      - /analyzers/scip-typescript
      - /analyzers/scip-python
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      analyzer-images:
        patterns: ["*"]
