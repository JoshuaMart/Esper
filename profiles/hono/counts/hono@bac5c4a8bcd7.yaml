# Hono itself, counted by hand (D16). An entry point is a declaration that is exported (a function,
# a public method of an exported class, a function an exported object holds, or a function given to
# the call whose result an exported name holds), or a function that takes the request or the
# context, and that reads the request in its own code or in what it calls: `c.req`, the standard
# `Request`, a cookie, or a value earlier middleware set on the context (`c.get`). Every file
# under src/ and adapters/ that touches the request was read; the entries below are all that
# qualify. What they read, and what is not counted:
# - The adapters (`handle` of AWS Lambda, Lambda@Edge, Netlify, Vercel, Cloudflare Pages, the
#   service worker) read the platform's event to build a `Request`; they are entry points
#   because they call `app.fetch`, which reads the path through `getPath`, a guess through the
#   field `Hono.getPath` that the constructor assigns.
# - Not counted: `getConnInfo` of Bun, Deno, Lambda@Edge and Netlify, which take the client's
#   address from the server or the platform's environment rather than the request;
#   `ipRestriction`, which takes it from a function the caller gives; and `HonoRequest.param`,
#   which reads the router's match rather than the request.
# - `HonoRequest.json`, `text` and the other body readers read the body through `raw[key]()`,
#   which no rule names: they are entry points through the `Content-Type` they read.
