# Kaneo's API (apps/api), a Hono application, counted by hand (D16): every registration on the
# routers of src/index.ts and of the module each `api.route()` mounts, each `openapi()` route with
# the method and path of its `createRoute` configuration. The routes were listed by a script
# written apart from Esper, from the text of each router module, and the five routes of
# src/integration-sync/index.ts, whose path is a constant the script does not read, by reading
# them; both lists match the index, route for route and line for line.
# - `app.route("/", mcpWellKnownRoutes(…))` serves the OAuth discovery documents at the root, and
#   the MCP router mounted at /api serves them again under /api.
# - `api.on([…], "/auth/*", …)` is one route per method, five in all.
