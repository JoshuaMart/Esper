# FastAPI 0.162.0, its request surface (D5), counted by hand (D16): each exported function, class
# and method that reads the request through what it reaches, and each function that takes the
# request, a connection, a websocket or an ASGI scope. A script written apart from Esper listed the
# functions of the package that read the request directly (a scope's keys, a request's attributes,
# parameters declared with `Query`, `Header`, `Form` and the like): each is an entry point below
# or is reached by one, but `FastAPI.__call__`, which writes `scope["app"]` and reads nothing.
# - **Security schemes**: each `__call__` reads `Authorization`, an API key's header, query
#   parameter or cookie; `OAuth2PasswordRequestForm` reads its form fields.
# - **The request handler**: `get_request_handler` builds `app`, which reads the body, the form
#   and `Content-Type`; `solve_dependencies` and `request_body_to_args` read the parameters.
#   What builds a route (`APIRoute.__init__`, `add_api_route`, `include_router`) reaches them
#   through the handler it builds, as Hono's factories reach the middleware they return.
# - **Routing and the frontend**: `APIRouter.app`, `matches` and `handle` read the scope's path
#   and method; `_FrontendRoute` and its group read `Accept` for navigation requests.
# - **Docs**: `FastAPI.setup` defines the OpenAPI and docs handlers, which read `root_path`.
# - **Telemetry**: the ASGI middleware reads the method, path, headers and client address.
# - Reached only through a call the index guesses ("the only method named …"): applications#FastAPI.include_router, applications#FastAPI.openapi, openapi/utils#get_fields_from_routes, openapi/utils#get_openapi, routing#APIRouter.include_router, routing#_FrontendRouteGroup._match, routing#_FrontendRouteGroup.matches, routing#_FrontendRouteGroup.matches_with_prefix, routing#iter_route_contexts.
