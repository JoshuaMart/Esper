# Space's backend (getspace), a FastAPI application (`backend/`: uv, psycopg, an MCP server),
# counted by hand (D16) and by a script written apart from Esper that lists each route decorator
# with Python's own parser: the same 90 decorated routes, route for route and line for line.
# - `src/space/app.py` declares three routes on the application, and its middleware: CORS (added
#   last, so outermost), `private_responses` (`@app.middleware("http")`), then
#   `HealthCheckedHostMiddleware`.
# - `src/space/api/rest.py` declares 87 routes on two routers, `public` and `router`, both with
#   the prefix `/v1`, included through a third router that `create_app` includes. Every route
#   of either takes `session=auth`, `session=read` or `session=write`, names that hold
#   `Depends(…)` or a call returning one, whose dependency `authenticated` depends on
#   `HTTPBearer(auto_error=False)` (which refuses nothing) and refuses without a token by raising
#   `Unauthenticated`, answered 401 by the application's exception handler: an `authn` guard.
#   `/v1/device/code` and `/v1/device/token` take no session.
# - `src/space/oauth_server.py`'s `routes()` returns Starlette `Route` objects that
#   `create_app` adds to the application's router: 16 routes, one per path and method, three of
#   them from a generator over a tuple of paths. Two of those paths differ only by their trailing
#   slash, `/.well-known/oauth-protected-resource/mcp` and `…/mcp/`, which normalise to the same
#   path (D7): the second is `…/mcp~2`.
# - `app.mount("/mcp", mcp_app)` serves the MCP server, built by the `mcp` package's FastMCP,
#   below `/mcp`: one entry point, `ANY /mcp/{rest...}`. Its tools are not routes of the
#   application: FastMCP is a framework of its own, which no profile describes yet.
