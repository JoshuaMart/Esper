# FastAPI's full-stack template (`backend/`: SQLModel, JWT, Alembic), counted by hand (D16) and
# by the same script as getspace: 23 decorated routes and the frontend served at the root.
# - Five routers, four with a prefix (`/users`, `/items`, `/utils`, `/private`), included
#   in `api_router`, which the application includes under `settings.API_V1_STR`, a setting
#   whose default is `/api/v1`. `private.router` is included only in development; it is counted.
# - Dependencies come through `Annotated` type aliases (`SessionDep`, `CurrentUser`), which
#   depend on `OAuth2PasswordBearer` (`authn`) and on `get_current_user`, and through
#   `dependencies=[Depends(get_current_active_superuser)]` on the decorator, which raises 403
#   (`authz-role`).
# - `app.frontend("/", directory=…)` serves the built frontend below the root:
#   `ANY /{rest...}`.
# - Paths keep FastAPI's trailing slash in the code (`"/"`), and lose it once joined (D7).
