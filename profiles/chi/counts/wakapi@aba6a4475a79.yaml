# Wakapi, a chi application, counted by hand (D16) from main.go and every RegisterRoutes.
# Two entries are kept with what the index could not read, and are expected as such:
# - `GET /${router}/leaderboard`: its handler is chosen by a generic helper
#   (`condition.Ternary[bool, routes.Handler](…)`), so the router it registers on is not bound;
#   its real path is `GET /leaderboard`.
# - `OPTIONS /api/${route.Pattern}`: one OPTIONS route per route already in the tree that
#   `r.Routes()` returns at run time, which depends on the order handlers register in.
# The five /debug/pprof routes are registered by `import _ "net/http/pprof"` on the default mux,
# which main.go serves on 127.0.0.1:6060 when profiling is enabled.
