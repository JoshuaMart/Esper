# Starlette 1.10.0, its request surface (D5), counted by hand (D16): each exported function, class
# and method that reads the request through what it reaches, and each function that takes the
# request, a connection, a websocket or an ASGI scope. A script written apart from Esper listed the
# functions of the package that read the request directly: each is an entry point below or is
# reached by one, but `Starlette.__call__`, which writes `scope["app"]`; `Headers.__init__`,
# which reads the headers of whatever mapping it is given, counted where a scope is given to it
# (`Headers(scope=…)`); the functions nested in `requires` and `SessionMiddleware.__call__`,
# reached through them; and the test client, which builds requests and is left out.
# - **The connection**: `HTTPConnection`'s properties (`headers`, `cookies`, `query_params`,
#   `path_params`, `client`, `url`, `base_url`, `session`, `state`, `user`, `auth`) and
#   `Request`'s `body`, `json`, `form` (the multipart parser), `method`; a websocket's receives.
# - **Middleware**: CORS reads `Origin` and the preflight's headers, `TrustedHostMiddleware`
#   `Host`, `HTTPSRedirectMiddleware` the scheme, sessions the cookie, GZip
#   `Accept-Encoding`, the body limit `Content-Length`, WSGI builds its environ from the scope.
# - **Routing**: each route's `matches` reads the path and the method, `Mount` and `Host` the
#   path and `Host`; `get_route_path` subtracts `root_path`; static files read the path,
#   `Range` and the conditional headers.
# - What the server sets in the scope (`type`, `asgi`, `http_version`, `extensions`) is not
#   read from the client: functions that only check the scope's type are not entry points.
# - Reached only through a call the index guesses ("the only method named …"):
#   routing#BaseRoute.__call__.
