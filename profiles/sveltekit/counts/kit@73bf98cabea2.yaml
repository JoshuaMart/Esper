# SvelteKit itself, the monorepo at @sveltejs/kit@3.1.0, counted by hand (D16). An entry point is a
# declaration that is exported (a function, a public method of an exported class, a function an
# exported object holds, or a function given to the call whose result an exported name holds), or a
# function that takes the request or the request event, as its code or its documentation comment
# states, and that reads the request in its own code or in what it calls: a `Request` (its headers,
# URL, method, body), the event's `params`, `locals`, `url`, `getClientAddress()`, `cookies.get`,
# or Node's request (adapter-node, `@sveltejs/kit/node`, the Vite dev and preview servers). The
# code that runs in the browser (src/runtime/client, `$app/forms`' client) is left out: it builds
# the requests the server reads. Every file that touches the request was read, and every
# declaration that reads it is one of these or reached from one.
# What they read, and what is not counted:
# - The server: `internal_respond` reads `Origin` for CSRF, `x-sveltekit-pathname` and
#   `x-sveltekit-search` for remote functions, the `__data.json` suffix and the trailing-slash
#   parameter on the path; its inner `resolve` takes the event; the actions read
#   `x-sveltekit-action`, `respond_with_error` reads `x-sveltekit-error`.
# - The adapters: adapter-node's `handler` reaches `ssr`, whose `getClientAddress` reads
#   `ADDRESS_HEADER` and `XFF_DEPTH` from Node's request, and `get_origin` the `PROTOCOL_HEADER`,
#   `HOST_HEADER` and `PORT_HEADER`; adapter-bun's `get_client_address` and `get_origin` do the
#   same on a `Request`; adapter-vercel's `getClientAddress` reads `X-Forwarded-For`. Their names
#   come from the environment, so the reads are `header` without a name.
# - `redirect`, `validate_redirect_location` and `is_external_location` read the origin of the
#   request being served, through `get_origin`; so does `test-redirect-importer`'s `authenticate`,
#   a package of the repository that calls `redirect`.
# - Not counted, since what they read comes from a package outside the repository or from a module
#   loaded at run time: adapter-cloudflare's worker and adapter-netlify's edge function, whose
#   request is typed by `@cloudflare/workers-types` and `@netlify/edge-functions`; `Server.respond`
#   and the `respond` that `create_server` returns, which call the instance `configure` imports with
#   `await import()`. `respond_to`, that instance's handler, is counted.
