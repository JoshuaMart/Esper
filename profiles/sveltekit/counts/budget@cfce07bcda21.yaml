# Budget, a SvelteKit 3 application (Svelte 5, better-auth, drizzle, adapter-bun), counted by hand
# (D16): every route its server files declare under src/routes, each `+server.ts` export of an HTTP
# method, each `+page.server.ts` `load` (a `GET` of the page) and each property of its `actions`
# (a `POST` to `?/<name>`). A script written apart from Esper listed the same 24, route for route
# and line for line, from the text of each file.
# - The pages without a server file (`/login`, `/logout`, only a `+page.svelte`) are not entry
#   points: what runs on the server for them is the hooks' `handle` and the root layout's `load`,
#   which are in front of the routes below.
# - `api/auth/[...all]/+server.ts` exports one handler as `GET` and `POST`: two routes, one handler.
# - Every route has `handle` of src/hooks.server.ts in its chain, which redirects a request without
#   a user unless its path is public (`/login`, `/register`, `/api/auth`); the index does not read
#   that condition on the path, so it gives the check to every route.
