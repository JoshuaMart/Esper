# Kener, a SvelteKit 2 status page (adapter-node), counted by hand (D16): every route its server
# files declare under src/routes, route groups `(api)`, `(kener)`, `(manage)` and the others taking
# no part in the path, each `+server.ts` export of an HTTP method, each `+page.server.ts` `load` and
# each action. A script written apart from Esper listed the same 90, route for route and line for
# line.
# - The chain of every route is `reroute` (src/hooks.ts), then `sequence(csrfHandle,
#   privateCacheHandle, apiAuthHandle)` (src/hooks.server.ts), seen through; the pages' `load` take
#   the layouts' `load` above them as well, outermost first.
# - `POST /manage/api` is a `+server.ts` of the `(manage)` group: the layout's `load`, which
#   redirects a request without a session, is in front of the group's pages and not of it. It checks
#   the session itself, and the index flags it as `divergent-guard`.
# - `[MMMM]-[YYYY]` and `latency-[tag]` are parameters inside a segment, `[...slug].md` a rest
#   parameter followed by text.
