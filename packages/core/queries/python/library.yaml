# What Python's standard library and common libraries do with what they are given: the calls that
# are sinks, that read or write persisted data, or that decode a request body. A call is a sink only
# when the argument it interprets is not a literal: `@1` names that argument when it is not the
# first, `@*` means any argument. Symbols are `<module>#<name>`, the module as the code imports it
# (`subprocess#run`, `sqlalchemy#text`), a method by its class (`sqlalchemy.orm#Session.execute`),
# and a built-in under `builtins`.

# Names a program uses without declaring them.
globals:
  - eval
  - exec
  - compile
  - open
  - print
  - len
  - str
  - int
  - float
  - bool
  - bytes
  - list
  - dict
  - set
  - frozenset
  - tuple
  - range
  - enumerate
  - zip
  - map
  - filter
  - sorted
  - reversed
  - min
  - max
  - sum
  - any
  - all
  - abs
  - round
  - isinstance
  - issubclass
  - getattr
  - setattr
  - hasattr
  - delattr
  - callable
  - iter
  - next
  - repr
  - hash
  - id
  - type
  - object
  - super
  - vars
  - dir
  - format
  - ord
  - chr
  - hex
  - divmod
  - pow
  - __import__
  - Exception
  - ValueError
  - TypeError
  - KeyError
  - RuntimeError
  - NotImplementedError
  - PermissionError
  - LookupError
  - AttributeError

# Members that values of the language's own types have (`str.format`, `dict.get`, `list.append`):
# a call of one on a value whose type the syntax does not state is not guessed to be a method of
# the target.
builtins:
  - get
  - items
  - keys
  - values
  - update
  - pop
  - popitem
  - setdefault
  - copy
  - clear
  - append
  - extend
  - insert
  - remove
  - index
  - count
  - sort
  - reverse
  - add
  - discard
  - union
  - intersection
  - difference
  - issubset
  - join
  - split
  - rsplit
  - splitlines
  - strip
  - lstrip
  - rstrip
  - replace
  - startswith
  - endswith
  - lower
  - upper
  - title
  - casefold
  - format
  - encode
  - decode
  - find
  - rfind
  - partition
  - rpartition
  - isdigit
  - isalnum
  - isalpha
  - zfill
  - read
  - readline
  - readlines
  - write
  - close
  - flush
  - seek
  - tell
  - fileno
  - hex
  - isoformat
  - timestamp
  - total_seconds
  - __enter__
  - __exit__
  - __aenter__
  - __aexit__
  - __init__
  - __call__
  - __str__
  - __repr__
  - __eq__
  - __hash__
  - send
  - throw
  - cancel
  - result
  - done
  - set_result
  - set_exception
  - acquire
  - release
  - wait
  - put
  - put_nowait
  - get_nowait
  - task_done
  # Pydantic's models.
  - errors
  - json
  - dict
  - model_dump
  - model_dump_json
  - model_copy
  - model_validate

# Pydantic's and SQLModel's methods that dump a model to a mapping, and that bind a value into a
# model, by name: a model spread or bound into what is written is `mass-assignment`.
models:
  dumps: [model_dump, dict, json]
  binds: [model_validate, from_orm, parse_obj, sqlmodel_update, model_construct]

# What functions outside the target return, where the syntax cannot say.
returns:
  sqlalchemy#create_engine: sqlalchemy#Engine
  sqlalchemy.ext.asyncio#create_async_engine: sqlalchemy.ext.asyncio#AsyncEngine
  psycopg#connect: psycopg#Connection
  psycopg.Connection#connect: psycopg#Connection
  psycopg2#connect: psycopg2#connection
  sqlite3#connect: sqlite3#Connection
  requests#Session: requests#Session

# What persisted data a call reads or writes.
data:
