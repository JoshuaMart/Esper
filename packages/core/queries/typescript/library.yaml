# What the JavaScript runtimes and common libraries do with what they are given: the calls that are
# sinks, that read or write persisted data, or that decode a request body. A call is a sink only
# when the argument it interprets is not a literal: `@1` names that argument when it is not the
# first, `@*` means any argument. Symbols are `<module>#<name>`, the module as the code imports it;
# Node's built-in modules always with `node:`, and the runtime's globals under `globalThis`.

# Names a program uses without declaring them.
globals:
  - fetch
  - eval
  - Function
  - Request
  - Response
  - Headers
  - URL
  - URLSearchParams
  - FormData
  - Blob
  - File
  - ReadableStream
  - WritableStream
  - TransformStream
  - TextEncoder
  - TextDecoder
  - AbortController
  - AbortSignal
  - WebSocket
  - crypto
  - structuredClone
  - setTimeout
  - setInterval
  - clearTimeout
  - clearInterval
  - queueMicrotask
  - atob
  - btoa
  - encodeURIComponent
  - decodeURIComponent
  - encodeURI
  - decodeURI
  - escape
  - unescape
  - parseInt
  - parseFloat
  - isNaN
  - isFinite
  - JSON
  - Math
  - Object
  - Array
  - String
  - Number
  - Boolean
  - Symbol
  - BigInt
  - Date
  - RegExp
  - Error
  - TypeError
  - RangeError
  - Map
  - Set
  - WeakMap
  - WeakSet
  - Promise
  - Reflect
  - Proxy
  - Intl
  - console
  - process
  - Buffer
  - globalThis

# Members that values of the language's own types have: a call of one on a value whose type the
# syntax does not state is not guessed to be a method of the target.
builtins:
  - map
  - filter
  - forEach
  - reduce
  - find
  - findIndex
  - some
  - every
  - includes
  - indexOf
  - join
  - push
  - pop
  - shift
  - unshift
  - slice
  - splice
  - sort
  - concat
  - flat
  - flatMap
  - keys
  - values
  - entries
  - at
  - fill
  - reverse
  - get
  - set
  - has
  - delete
  - add
  - clear
  - then
  - catch
  - finally
  - toString
  - toJSON
  - valueOf
  - split
  - trim
  - trimStart
  - trimEnd
  - replace
  - replaceAll
  - startsWith
  - endsWith
  - toLowerCase
  - toUpperCase
  - padStart
  - padEnd
  - match
  - matchAll
  - test
  - exec
  - charAt
  - charCodeAt
  - codePointAt
  - substring
  - normalize
  - localeCompare
  - repeat
  - search
  - toFixed
  - toISOString
  - getTime
  - call
  - apply
  - bind
  - next
  - return
  - throw
  - emit
  - on
  - once
  - off
  - write
  - end
  - close
  - send
  - json
  - text
  - arrayBuffer
  - blob
  - formData
  - clone
  - append
  - abort
  - read
  - pipe
  - pipeTo
  - pipeThrough
  - getReader
  - getWriter
  - encode
  - decode
  - parse
  - stringify

# The type a function outside the target returns, for the calls made on what it gives; `@n` is
# the type of its n-th argument, which a proxy keeps.
returns:
  drizzle-orm/node-postgres#drizzle: drizzle-orm/node-postgres#NodePgDatabase
  drizzle-orm/postgres-js#drizzle: drizzle-orm/postgres-js#PostgresJsDatabase
  drizzle-orm/mysql2#drizzle: drizzle-orm/mysql2#MySql2Database
  drizzle-orm/better-sqlite3#drizzle: drizzle-orm/better-sqlite3#BetterSQLite3Database
  drizzle-orm/libsql#drizzle: drizzle-orm/libsql#LibSQLDatabase
  drizzle-orm/d1#drizzle: drizzle-orm/d1#DrizzleD1Database
  drizzle-orm/neon-http#drizzle: drizzle-orm/neon-http#NeonHttpDatabase
  drizzle-orm/bun-sqlite#drizzle: drizzle-orm/bun-sqlite#BunSQLiteDatabase
  globalThis#Proxy: "@0"
  mysql2/promise#createPool: mysql2/promise#Pool
  mysql2/promise#createConnection: mysql2/promise#Connection
  mysql2#createPool: mysql2#Pool
  mysql2#createConnection: mysql2#Connection

# Types whose methods return the type itself, so that a chain of calls keeps it.
fluent: []

sinks:
  sql:
    - pg#Pool.query
    - pg#Client.query
    - pg#PoolClient.query
    - mysql2#Pool.query
    - mysql2#Connection.query
    - mysql2/promise#Pool.query
    - mysql2/promise#Pool.execute
    - mysql2/promise#Connection.query
    - mysql2/promise#Connection.execute
    - better-sqlite3#Database.prepare
    - better-sqlite3#Database.exec
    - drizzle-orm#sql.raw
  process:
    - node:child_process#exec
    - node:child_process#execSync
    - node:child_process#execFile@*
    - node:child_process#execFileSync@*
    - node:child_process#spawn@*
    - node:child_process#spawnSync@*
    - node:child_process#fork
    - globalThis#eval
    - globalThis#Function@*
    - node:vm#runInNewContext
    - node:vm#runInThisContext
    - node:vm#runInContext
  file:
    - node:fs#readFile
    - node:fs#readFileSync
    - node:fs#writeFile
    - node:fs#writeFileSync
    - node:fs#appendFile
    - node:fs#appendFileSync
    - node:fs#createReadStream
    - node:fs#createWriteStream
    - node:fs#unlink
    - node:fs#unlinkSync
    - node:fs#rm
    - node:fs#rmSync
    - node:fs#readdir
    - node:fs#readdirSync
    - node:fs#open
    - node:fs#openSync
    - node:fs#stat
    - node:fs#statSync
    - node:fs/promises#readFile
    - node:fs/promises#writeFile
    - node:fs/promises#appendFile
    - node:fs/promises#unlink
    - node:fs/promises#rm
    - node:fs/promises#readdir
    - node:fs/promises#open
    - node:fs/promises#stat
    - node:fs#promises.readFile
    - node:fs#promises.writeFile
  fetch:
    - globalThis#fetch
    - node:http#request
    - node:http#get
    - node:https#request
    - node:https#get
    - axios#default
    - axios#default.get
    - axios#default.post
    - axios#default.put
    - axios#default.delete
    - axios#default.request
    - undici#fetch
    - undici#request
  redirect: []
  unescaped: []

data:
  write:
    - drizzle-orm/node-postgres#NodePgDatabase.insert
    - drizzle-orm/node-postgres#NodePgDatabase.update
    - drizzle-orm/node-postgres#NodePgDatabase.delete
    - drizzle-orm/node-postgres#NodePgDatabase.execute
    - drizzle-orm/postgres-js#PostgresJsDatabase.insert
    - drizzle-orm/postgres-js#PostgresJsDatabase.update
    - drizzle-orm/postgres-js#PostgresJsDatabase.delete
    - drizzle-orm/postgres-js#PostgresJsDatabase.execute
    - drizzle-orm/mysql2#MySql2Database.insert
    - drizzle-orm/mysql2#MySql2Database.update
    - drizzle-orm/mysql2#MySql2Database.delete
    - drizzle-orm/mysql2#MySql2Database.execute
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.insert
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.update
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.delete
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.execute
    - drizzle-orm/libsql#LibSQLDatabase.insert
    - drizzle-orm/libsql#LibSQLDatabase.update
    - drizzle-orm/libsql#LibSQLDatabase.delete
    - drizzle-orm/libsql#LibSQLDatabase.execute
    - drizzle-orm/d1#DrizzleD1Database.insert
    - drizzle-orm/d1#DrizzleD1Database.update
    - drizzle-orm/d1#DrizzleD1Database.delete
    - drizzle-orm/d1#DrizzleD1Database.execute
    - drizzle-orm/neon-http#NeonHttpDatabase.insert
    - drizzle-orm/neon-http#NeonHttpDatabase.update
    - drizzle-orm/neon-http#NeonHttpDatabase.delete
    - drizzle-orm/neon-http#NeonHttpDatabase.execute
    - drizzle-orm/bun-sqlite#BunSQLiteDatabase.insert
    - drizzle-orm/bun-sqlite#BunSQLiteDatabase.update
    - drizzle-orm/bun-sqlite#BunSQLiteDatabase.delete
    - drizzle-orm/bun-sqlite#BunSQLiteDatabase.execute
    - pg#Pool.query
    - pg#Client.query
    - mysql2/promise#Pool.execute
    - mysql2/promise#Connection.execute
  read:
    - drizzle-orm/node-postgres#NodePgDatabase.select
    - drizzle-orm/node-postgres#NodePgDatabase.selectDistinct
    - drizzle-orm/node-postgres#NodePgDatabase.execute
    - drizzle-orm/postgres-js#PostgresJsDatabase.select
    - drizzle-orm/postgres-js#PostgresJsDatabase.selectDistinct
    - drizzle-orm/postgres-js#PostgresJsDatabase.execute
    - drizzle-orm/mysql2#MySql2Database.select
    - drizzle-orm/mysql2#MySql2Database.selectDistinct
    - drizzle-orm/mysql2#MySql2Database.execute
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.select
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.selectDistinct
    - drizzle-orm/better-sqlite3#BetterSQLite3Database.execute
    - drizzle-orm/libsql#LibSQLDatabase.select
    - drizzle-orm/libsql#LibSQLDatabase.selectDistinct
    - drizzle-orm/libsql#LibSQLDatabase.execute
    - drizzle-orm/d1#DrizzleD1Database.select
    - drizzle-orm/d1#DrizzleD1Database.selectDistinct
